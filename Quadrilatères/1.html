<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Définition</title>
<style>
  /* الألوان الأساسية */
  :root {
    --primary: #1e3a8a;      /* أزرق داكن */
    --primary-light: #dbeafe;/* أزرق فاتح جدا */
    --accent: #059669;       /* أخضر زمردي */
    --accent-light: #d1fae5; /* أخضر فاتح */
    --highlight: #ea580c;    /* برتقالي داكن */
    --highlight-light: #ffedd5;
    --text-main: #1f2937;
    --text-muted: #4b5563;
    --bg-body: #f3f4f6;
    --bg-card: #ffffff;
    --border-color: #e5e7eb;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Tahoma, Arial, sans-serif;
    line-height: 1.7; color: var(--text-main); margin: 0; padding: 15px; 
    background: var(--bg-body);
    word-wrap: break-word; overflow-wrap: break-word;
  }

  .container {
    max-width: 900px; margin: 0 auto; background: var(--bg-card);
    padding: 25px 20px; border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.03);
  }

  h1 {
    color: var(--primary); text-align: center; 
    font-size: clamp(1.3rem, 5vw, 2rem);
    font-weight: 800; letter-spacing: -0.5px;
    margin: 0 0 25px; padding-bottom: 15px;
    border-bottom: 3px solid var(--primary-light);
    position: relative;
  }
  h1::after {
    content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
    width: 80px; height: 3px; background: var(--primary); border-radius: 3px;
  }

  h2 {
    color: var(--primary); background: linear-gradient(to right, var(--primary-light), transparent);
    padding: 10px 15px; border-left: 5px solid var(--primary); border-radius: 6px;
    margin-top: 30px; margin-bottom: 15px;
    font-size: clamp(1.05rem, 3.5vw, 1.3rem); font-weight: 700;
  }

  h3 { color: var(--highlight); margin-top: 15px; font-size: clamp(0.95rem, 3vw, 1.1rem); font-weight: 700; }
  
  p, li { font-size: clamp(0.9rem, 3vw, 1rem); color: var(--text-muted); }
  strong { color: var(--primary); font-weight: 600; }
  
  hr { border: none; border-top: 2px dashed var(--border-color); margin: 25px 0; }

  /* حاوية الجدول */
  .table-wrap { 
    margin: 20px 0; border-radius: 12px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
    overflow: hidden; /* باش تبقى الزوايا مدورة */
  }
  
  .custom-table {
    display: flex; flex-wrap: wrap; width: 100%; background: var(--bg-card);
  }
  .table-cell {
    flex: 1 1 50%; /* كياخد 50% فـ الشاشات الكبار */
    padding: 20px; text-align: center; 
    border-bottom: 1px solid var(--border-color);
  }
  /* الخطوط الفاصلة */
  .table-cell:nth-child(odd) { border-right: 1px solid var(--border-color); }
  .table-cell:nth-child(3), .table-cell:nth-child(4) { border-bottom: none; }
  
  /* السطر الأخير (À savoir) */
  .table-full {
    flex: 1 1 100%; padding: 15px; text-align: center; 
    background: var(--highlight-light); border-top: 1px solid var(--border-color);
  }

  /* SVG Container */
  .svg-box {
    display: flex; justify-content: center; align-items: center;
    height: 80px; margin-bottom: 15px;
  }
  .svg-box svg {
    max-width: 100%; height: 100%; object-fit: contain;
  }

  /* الجدول المقارن (Table) */
  .responsive-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border-color); }
  .compare-table { border-collapse: collapse; width: 100%; min-width: 500px; background: var(--bg-card); font-size: clamp(0.85rem, 2.5vw, 1rem); }
  .compare-table th, .compare-table td { border: 1px solid var(--border-color); padding: 12px 8px; text-align: center; }
  .compare-table th { background: var(--primary); color: #fff; font-size: clamp(0.8rem, 2.5vw, 0.95rem); }
  .compare-table tr:nth-child(even) { background: #f8fafc; }

  /* الصندوق الأصفر (Formule) */
  .formule {
    background: var(--highlight-light); border-left: 5px solid var(--highlight); 
    padding: 12px 15px; margin: 20px 0; 
    font-family: "Cambria Math", "Times New Roman", serif;
    font-size: clamp(0.95rem, 3vw, 1.15rem); text-align: center; border-radius: 8px;
    color: #9a3412; font-weight: bold;
  }

  /* التمارين التفاعلية */
  .exo {
    background: #ffffff; border: 2px solid var(--primary-light); border-radius: 12px;
    padding: 18px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .exo .enonce { font-size: clamp(0.9rem, 3vw, 1rem); margin-bottom: 15px; color: var(--text-main); }
  .exo .enonce strong { color: var(--primary); }

  /* الأزرار */
  .btn-corr {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 12px 18px; font-size: clamp(0.85rem, 2.8vw, 1rem); font-weight: 600;
    cursor: pointer; transition: all 0.3s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 6px rgba(5, 150, 105, 0.3);
  }
  .btn-corr:hover { background: #047857; }
  .btn-corr .arrow { transition: transform 0.3s ease; font-size: 0.8em; }
  .btn-corr.open .arrow { transform: rotate(90deg); }

  /* التصحيح */
  .correction {
    display: none; background: var(--accent-light); border-left: 5px solid var(--accent);
    border-radius: 8px; padding: 15px; margin-top: 15px;
    font-size: clamp(0.85rem, 2.8vw, 1rem); color: #064e3b;
  }
  .correction.show { display: block; }
  .correction .etape { display: block; margin: 5px 0; }
  .correction .resultat {
    display: inline-block; background: var(--accent); color: #fff;
    padding: 4px 10px; border-radius: 6px; font-weight: bold;
    margin-top: 10px; font-family: "Cambria Math", serif;
  }

  /* ========================================= */
  /*        التجاوب مع الهواتف (Responsive)     */
  /* ========================================= */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .container { padding: 15px 12px; border-radius: 12px; }
    
    /* تحويل الجدول لعمود واحد فـ الهواتف */
    .table-cell {
      flex: 1 1 100%; /* كياخد العرض كامل */
      border-right: none !important;
      border-bottom: 1px solid var(--border-color) !important;
    }
    .table-cell:last-of-type { border-bottom: none !important; }
    
    /* تصغير المسافات */
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; padding: 8px 12px; }
    
    /* جعل الزر بعرض كامل باش يسهل الضغط عليه */
    .btn-corr { width: 100%; }
    
    /* تصغير حجم SVG فـ الهواتف باش ما ياخدش بلاصة كبيرة */
    .svg-box { height: 70px; margin-bottom: 10px; }
  }
</style>

</head>
<body >
<div class="container">
<h1>Les Quadrilatères — 4AP</h1>
<h2>1. Définition</h2>
<p>Un <strong>quadrilatère</strong> est un polygone qui possède <strong>4 côtés</strong>, <strong>4 sommets</strong> et <strong>4 angles</strong>.</p>
<div class="formule">
  <strong>4 côtés + 4 sommets + 4 angles</strong>
</div>
<div style="text-align: center; margin: 20px 0;">
  <!-- رسم توضيحي -->
  <svg style="max-width: 100%; height: auto;" width="280" height="160" viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg">
    <polygon points="40,30 210,30 180,120 20,120" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.5" stroke-linejoin="round"></polygon>
    
    <circle cx="40" cy="30" r="5" fill="#ea580c"></circle>
    <circle cx="210" cy="30" r="5" fill="#ea580c"></circle>
    <circle cx="180" cy="120" r="5" fill="#ea580c"></circle>
    <circle cx="20" cy="120" r="5" fill="#ea580c"></circle>
    
    <text x="125" y="20" font-size="15" fill="#059669" font-weight="bold" text-anchor="middle">côté</text>
    <path d="M 100 25 L 100 28" stroke="#059669" stroke-width="2" fill="none"></path>
    <path d="M 150 25 L 150 28" stroke="#059669" stroke-width="2" fill="none"></path>
    
    <text x="45" y="55" font-size="15" fill="#ea580c" font-weight="bold">angle</text>
    <path d="M 50 58 L 65 58" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round"></path>
    
    <text x="215" y="25" font-size="15" fill="#ea580c" font-weight="bold">sommet</text>
    <path d="M 210 38 L 210 45" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round"></path>
  </svg>
</div>
<hr>

<!-- Bouton en bas de page -->
<div class="open-link-container">
    <button class="open-link-btn" onclick="openHtmlPage()">
        Si la page ne s'affiche pas correctement : Cliquez ici
    </button>
</div>

<style>
  .open-link-container {
    display: flex; justify-content: center; align-items: center;
    margin: 30px auto 20px; padding: 0 12px; width: 100%;
    box-sizing: border-box;
  }
  .open-link-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 10px; background: linear-gradient(135deg, #1a5276, #2874a6);
    color: #ffffff; border: none; padding: 16px 28px;
    font-size: 1rem; font-weight: 700; border-radius: 12px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(26, 82, 118, 0.35);
    font-family: inherit; max-width: 100%; text-align: center;
    line-height: 1.35;
  }
  .open-link-btn:hover {
    background: linear-gradient(135deg, #154360, #1f5b85);
  }
  @media (max-width: 480px) {
    .open-link-btn { padding: 14px 20px; font-size: 0.9rem; width: 100%; }
  }
</style>

<script>
  function openHtmlPage() {
    window.open(window.location.href, '_blank');
  }
</script>

</div>
<script>
function toggleCorr(btn) {
  var corr = btn.nextElementSibling;
  if (corr.classList.contains('show')) {
    corr.classList.remove('show');
    btn.classList.remove('open');
    btn.innerHTML = '<span class="arrow">▶</span> Afficher la correction';
  } else {
    corr.classList.add('show');
    btn.classList.add('open');
    btn.innerHTML = '<span class="arrow">▶</span> Masquer la correction';
  }
}
</script>
</body>
</html>
